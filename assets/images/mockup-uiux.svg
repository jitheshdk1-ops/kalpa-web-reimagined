<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <filter id="shadowUI" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#141414" rx="14"/>
  <!-- Browser Window Mockup -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="10" fill="#0C0C0C" stroke="#262626" stroke-width="1.5" filter="url(#shadowUI)"/>
    <!-- Window controls -->
    <circle cx="16" cy="14" r="3.5" fill="#FFE600"/>
    <circle cx="28" cy="14" r="3.5" fill="#444444"/>
    <circle cx="40" cy="14" r="3.5" fill="#333333"/>
    <line x1="0" y1="28" x2="340" y2="28" stroke="#222222" stroke-width="1"/>
    
    <!-- Dashboard Content -->
    <!-- Left Navigation Bar -->
    <rect x="12" y="40" width="45" height="175" rx="6" fill="#141414"/>
    <rect x="20" y="52" width="28" height="6" rx="3" fill="#FFE600"/>
    <rect x="20" y="68" width="20" height="4" rx="2" fill="#444444"/>
    <rect x="20" y="80" width="24" height="4" rx="2" fill="#333333"/>
    <rect x="20" y="92" width="18" height="4" rx="2" fill="#333333"/>
    
    <!-- Main Content Area -->
    <!-- Header banner -->
    <rect x="70" y="40" width="256" height="45" rx="6" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
    <rect x="85" y="52" width="90" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="85" y="66" width="140" height="6" rx="3" fill="#666666"/>
    <rect x="270" y="52" width="42" height="22" rx="11" fill="#FFE600"/>

    <!-- Two metric widgets -->
    <rect x="70" y="95" width="122" height="65" rx="6" fill="#141414" stroke="#242424" stroke-width="1"/>
    <text x="82" y="115" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#888888">GROWTH INDEX</text>
    <text x="82" y="140" font-family="'Syne', sans-serif" font-size="20" font-weight="800" fill="#FFE600">+184%</text>
    
    <rect x="204" y="95" width="122" height="65" rx="6" fill="#141414" stroke="#242424" stroke-width="1"/>
    <!-- Sparkline chart -->
    <polyline points="214,145 235,130 255,140 275,115 295,125 315,108" fill="none" stroke="#FFE600" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Table Rows -->
    <rect x="70" y="170" width="256" height="45" rx="6" fill="#121212" stroke="#202020" stroke-width="1"/>
    <line x1="85" y1="184" x2="310" y2="184" stroke="#222222" stroke-width="1"/>
    <line x1="85" y1="198" x2="260" y2="198" stroke="#1c1c1c" stroke-width="1"/>
  </g>
</svg>
