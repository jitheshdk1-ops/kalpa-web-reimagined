<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="100%" height="100%">
  <defs>
    <linearGradient id="socialBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="45%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="curvedYellowNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38600" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFDE59" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#FFE600" stop-opacity="1" />
      <stop offset="90%" stop-color="#FFFFE0" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E6B800" stop-opacity="0" />
    </linearGradient>

    <filter id="curvedYellowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="320" fill="url(#socialBg)" />

  <!-- Car outline in dark charcoal -->
  <path d="M 20 180 Q 90 90 180 80 Q 250 85 290 120" stroke="#2A2A2A" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 80 100 Q 140 50 220 60 Q 270 80 290 110" stroke="#333333" stroke-width="1.5" fill="none" opacity="0.4" />

  <!-- Sweeping aerodynamic vibrant yellow light flare -->
  <g filter="url(#curvedYellowGlow)">
    <path d="M 70 145 Q 160 115 280 110" stroke="url(#curvedYellowNeon)" stroke-width="14" stroke-linecap="round" />
    <path d="M 120 138 Q 180 120 250 114" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="230" cy="116" rx="16" ry="6" fill="#FFE600" opacity="0.9" />
  </g>
</svg>
