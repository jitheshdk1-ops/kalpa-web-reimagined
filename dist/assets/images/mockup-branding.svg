<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#141414" rx="14"/>
  <!-- Layered Brand Stationary Cards -->
  <g transform="translate(40, 30)">
    <!-- Back card -->
    <rect x="50" y="20" width="220" height="150" rx="10" fill="#1f1f1f" stroke="#333333" stroke-width="1.5" transform="rotate(6 160 95)" filter="url(#shadow)"/>
    <!-- Middle palette card -->
    <rect x="25" y="30" width="230" height="155" rx="10" fill="#161616" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(-3 140 105)" filter="url(#shadow)"/>
    <g transform="rotate(-3 140 105)">
      <!-- Swatches -->
      <rect x="45" y="55" width="24" height="24" rx="4" fill="#FFE600"/>
      <rect x="75" y="55" width="24" height="24" rx="4" fill="#FFFFFF"/>
      <rect x="105" y="55" width="24" height="24" rx="4" fill="#333333"/>
      <rect x="135" y="55" width="24" height="24" rx="4" fill="#000000"/>
      <!-- Grid lines -->
      <line x1="45" y1="95" x2="230" y2="95" stroke="#333333" stroke-width="1"/>
      <line x1="45" y1="115" x2="190" y2="115" stroke="#252525" stroke-width="1"/>
      <line x1="45" y1="135" x2="150" y2="135" stroke="#252525" stroke-width="1"/>
    </g>
    <!-- Foreground Business Card with Logo Mark -->
    <rect x="60" y="70" width="210" height="120" rx="10" fill="#0C0C0C" stroke="#FFE600" stroke-width="1.5" filter="url(#shadow)"/>
    <g transform="translate(85, 95)">
      <polygon points="15,5 30,35 0,35" fill="#FFE600"/>
      <circle cx="15" cy="24" r="4" fill="#0C0C0C"/>
      <text x="45" y="22" font-family="'Syne', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.05em">KALPA</text>
      <text x="45" y="34" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FFE600" letter-spacing="0.15em">STUDIO IDENTITY</text>
      <line x1="0" y1="50" x2="160" y2="50" stroke="#262626" stroke-width="1"/>
      <circle cx="8" cy="65" r="3" fill="#FFE600"/>
      <circle cx="22" cy="65" r="3" fill="#555555"/>
      <circle cx="36" cy="65" r="3" fill="#333333"/>
    </g>
  </g>
</svg>
