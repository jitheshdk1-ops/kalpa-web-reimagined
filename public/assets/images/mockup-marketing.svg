<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <filter id="shadowMarketing" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#141414" rx="14"/>

  <!-- Analytics & Ads Console Mockup -->
  <g transform="translate(30, 22)">
    <rect x="0" y="0" width="340" height="236" rx="10" fill="#0C0C0C" stroke="#262626" stroke-width="1.5" filter="url(#shadowMarketing)"/>
    
    <!-- Top Bar -->
    <circle cx="16" cy="14" r="3.5" fill="#FFE600"/>
    <circle cx="28" cy="14" r="3.5" fill="#444444"/>
    <circle cx="40" cy="14" r="3.5" fill="#333333"/>
    <text x="60" y="18" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#666666" letter-spacing="1">CAMPAIGN INTELLIGENCE</text>
    <line x1="0" y1="28" x2="340" y2="28" stroke="#222222" stroke-width="1"/>

    <!-- Channel Pills -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="68" height="18" rx="9" fill="#1C1C1C" stroke="#FFE600" stroke-width="1"/>
      <circle cx="8" cy="9" r="3" fill="#FFE600"/>
      <text x="16" y="12.5" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">GOOGLE ADS</text>

      <rect x="74" y="0" width="60" height="18" rx="9" fill="#181818" stroke="#333333" stroke-width="1"/>
      <circle cx="82" cy="9" r="3" fill="#FFE600"/>
      <text x="90" y="12.5" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#AAAAAA">META ADS</text>

      <rect x="140" y="0" width="46" height="18" rx="9" fill="#181818" stroke="#333333" stroke-width="1"/>
      <circle cx="148" cy="9" r="3" fill="#FFE600"/>
      <text x="156" y="12.5" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#AAAAAA">SEO OPS</text>
    </g>

    <!-- KPI Metric Cards -->
    <!-- Metric 1: Blended ROAS -->
    <rect x="16" y="66" width="148" height="60" rx="7" fill="#141414" stroke="#242424" stroke-width="1"/>
    <text x="28" y="84" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#888888" letter-spacing="0.5">BLENDED ROAS</text>
    <text x="28" y="112" font-family="'Syne', sans-serif" font-size="22" font-weight="800" fill="#FFE600">4.82x</text>
    <text x="96" y="112" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#00E599">▲ +38%</text>

    <!-- Metric 2: Conversion Rate -->
    <rect x="176" y="66" width="148" height="60" rx="7" fill="#141414" stroke="#242424" stroke-width="1"/>
    <text x="188" y="84" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#888888" letter-spacing="0.5">CONVERSION RATE</text>
    <text x="188" y="112" font-family="'Syne', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">6.4%</text>
    <text x="252" y="112" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFE600">★ OPTIMAL</text>

    <!-- Chart Panel -->
    <rect x="16" y="136" width="308" height="88" rx="7" fill="#121212" stroke="#202020" stroke-width="1"/>
    
    <!-- Grid Lines -->
    <line x1="28" y1="156" x2="312" y2="156" stroke="#1D1D1D" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="28" y1="184" x2="312" y2="184" stroke="#1D1D1D" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="28" y1="210" x2="312" y2="210" stroke="#222222" stroke-width="1"/>

    <!-- Bar Chart Elements -->
    <rect x="36" y="180" width="12" height="30" rx="2" fill="#2A2A2A"/>
    <rect x="52" y="165" width="12" height="45" rx="2" fill="#FFE600"/>

    <rect x="80" y="175" width="12" height="35" rx="2" fill="#2A2A2A"/>
    <rect x="96" y="152" width="12" height="58" rx="2" fill="#FFE600"/>

    <rect x="124" y="170" width="12" height="40" rx="2" fill="#2A2A2A"/>
    <rect x="140" y="146" width="12" height="64" rx="2" fill="#FFE600"/>

    <!-- Area Chart Curve & Gradient -->
    <path d="M 168 190 Q 200 178, 230 162 T 304 144 L 304 210 L 168 210 Z" fill="url(#chartGrad)"/>
    <path d="M 168 190 Q 200 178, 230 162 T 304 144" fill="none" stroke="#FFE600" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="304" cy="144" r="4" fill="#FFE600" stroke="#0C0C0C" stroke-width="2"/>
  </g>
</svg>