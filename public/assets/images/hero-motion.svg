<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean Minimalist White to Light Gray -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA" />
      <stop offset="50%" stop-color="#EFF1F4" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>

    <!-- Vibrant Kinetic Yellow Streaks Gradients -->
    <linearGradient id="yellowStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0" />
      <stop offset="15%" stop-color="#FFDE59" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#FFE600" stop-opacity="1" />
      <stop offset="85%" stop-color="#FFF066" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E6B800" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="whiteStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#FFFFF0" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="goldStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC9900" stop-opacity="0" />
      <stop offset="30%" stop-color="#E6B800" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B38600" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Motion Blur & Soft Glow -->
    <filter id="intenseYellowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="motionBlurX" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="30 2" />
    </filter>
    
    <filter id="heavyMotionBlur" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="55 4" />
    </filter>

    <filter id="figureBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12 2" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Ambient Light Vignette (Vibrant Yellow) -->
  <circle cx="800" cy="420" r="500" fill="#FFE600" opacity="0.16" filter="url(#heavyMotionBlur)" />
  <circle cx="850" cy="380" r="300" fill="#FFFFFF" opacity="0.5" filter="url(#figureBlur)" />

  <!-- Silhouette in Motion (Kinetic Runner / Figure) -->
  <g filter="url(#figureBlur)">
    <!-- Head / Hood in solid black -->
    <ellipse cx="800" cy="180" rx="42" ry="48" fill="#000000" opacity="0.95" />
    <path d="M780 150 Q800 135 825 152 Q845 175 830 215 Q800 230 770 210 Z" fill="#000000" opacity="0.98" />
    
    <!-- Torso / Windbreaker jacket in dynamic motion -->
    <path d="M740 220 C710 260 670 330 630 420 C680 440 760 450 820 440 C880 430 960 380 980 320 C960 270 910 230 850 215 C810 210 770 210 740 220 Z" fill="#0A0A0A" opacity="0.92" />
    <path d="M770 240 C750 300 710 380 660 460 C730 480 840 470 920 430 C880 350 860 280 830 240 Z" fill="#141414" opacity="0.95" />
    
    <!-- Motion shadow trails behind figure -->
    <ellipse cx="710" cy="350" rx="140" ry="110" fill="#000000" opacity="0.45" filter="url(#motionBlurX)" />
    <ellipse cx="890" cy="380" rx="160" ry="90" fill="#111111" opacity="0.35" filter="url(#motionBlurX)" />
  </g>

  <!-- Kinetic Neon Vibrant Yellow Streaks (High-Speed Motion Blur) -->
  <g filter="url(#intenseYellowGlow)">
    <!-- Broad background yellow/gold glow -->
    <rect x="420" y="320" width="760" height="110" rx="55" fill="url(#goldStreak)" filter="url(#heavyMotionBlur)" />

    <!-- Main dynamic streak 1 -->
    <path d="M 450 350 Q 750 340 1080 370" stroke="url(#yellowStreak)" stroke-width="40" stroke-linecap="round" filter="url(#motionBlurX)" />
    
    <!-- Hot core white light trail 1 -->
    <path d="M 520 352 Q 780 342 1020 368" stroke="url(#whiteStreak)" stroke-width="12" stroke-linecap="round" />

    <!-- Main dynamic streak 2 -->
    <path d="M 540 395 Q 820 405 1160 380" stroke="url(#yellowStreak)" stroke-width="46" stroke-linecap="round" filter="url(#motionBlurX)" />
    
    <!-- Hot core white light trail 2 -->
    <path d="M 620 397 Q 850 404 1090 382" stroke="url(#whiteStreak)" stroke-width="14" stroke-linecap="round" />

    <!-- Lower secondary streaks -->
    <path d="M 480 435 Q 720 440 980 425" stroke="url(#yellowStreak)" stroke-width="24" stroke-linecap="round" filter="url(#motionBlurX)" />
    <path d="M 690 310 Q 890 300 1120 325" stroke="url(#goldStreak)" stroke-width="18" stroke-linecap="round" filter="url(#motionBlurX)" />
    <path d="M 760 312 Q 910 302 1050 324" stroke="url(#yellowStreak)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Speed Particles & Accent Flares -->
  <ellipse cx="980" cy="375" rx="35" ry="8" fill="#FFFFE0" opacity="0.95" filter="url(#motionBlurX)" />
  <ellipse cx="610" cy="355" rx="45" ry="6" fill="#FFEE55" opacity="0.85" filter="url(#motionBlurX)" />
  <circle cx="830" cy="370" r="14" fill="#FFFFFF" opacity="0.9" />
</svg>
