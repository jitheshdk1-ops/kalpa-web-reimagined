<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <filter id="shadowPack" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#141414" rx="14"/>
  <!-- 3D Packaging Box Mockup -->
  <g transform="translate(100, 35)" filter="url(#shadowPack)">
    <!-- Top face -->
    <polygon points="100,20 180,50 100,75 20,45" fill="#222222" stroke="#333333" stroke-width="1"/>
    <!-- Left face -->
    <polygon points="20,45 100,75 100,195 20,165" fill="#141414" stroke="#252525" stroke-width="1"/>
    <!-- Right face -->
    <polygon points="100,75 180,50 180,170 100,195" fill="#0C0C0C" stroke="#202020" stroke-width="1"/>
    
    <!-- Branding on Right Face -->
    <g transform="matrix(0.89 0.25 0 0.95 105 85)">
      <rect x="10" y="15" width="28" height="28" rx="4" fill="#FFE600"/>
      <polygon points="24,20 34,36 14,36" fill="#0C0C0C"/>
      <text x="46" y="27" font-family="'Syne', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.1em">EDITION 01</text>
      <text x="46" y="38" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#FFE600" letter-spacing="0.2em">PREMIUM BOX</text>
      <line x1="10" y1="52" x2="72" y2="52" stroke="#333333" stroke-width="1"/>
    </g>

    <!-- Branding on Left Face -->
    <g transform="matrix(0.89 -0.25 0 0.95 25 100)">
      <line x1="5" y1="10" x2="65" y2="10" stroke="#333333" stroke-width="1"/>
      <text x="5" y="25" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#888888" letter-spacing="0.15em">NET WT. 250G</text>
      <circle cx="12" cy="40" r="3" fill="#FFE600"/>
      <circle cx="24" cy="40" r="3" fill="#444444"/>
    </g>
  </g>
</svg>
